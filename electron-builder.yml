appId: dev.nhan.usage-monitor
productName: Usage Monitor
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!docs/*'
  - '!.claude/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,vitest.config.ts,components.json}'
asarUnpack:
  - resources/**
mac:
  category: public.app-category.developer-tools
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
  # Personal build: never pick up a random certificate from the keychain.
  # Electron's own ad-hoc signature is kept, so the app runs after removing the quarantine flag.
  identity: null
  notarize: false
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
